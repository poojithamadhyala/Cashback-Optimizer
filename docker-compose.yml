# Local Postgres for development and integration tests.
#
# Usage:
#   docker compose up -d db          # start Postgres
#   ./scripts/run-integration.sh     # migrate + run the PG integration tests
#   docker compose down -v           # stop and wipe
#
# NOTE: could not be started in the build sandbox (no container registry access).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: loyalty
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loyalty"]
      interval: 3s
      timeout: 3s
      retries: 20
